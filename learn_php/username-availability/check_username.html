<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Username Checker</title>
    <style>
        #status {
            font-weight: bold;
        }
    </style>
    <script>
        async function checkUsername() {
            const username = document.getElementById("username").value;
            const status = document.getElementById("status");

            if (username.trim() === "") {
                status.textContent = "";
                return;
            }

            try {
                const response = await fetch(`check_username.php?username=${encodeURIComponent(username)}`);
                const data = await response.json();

                if (data.available) {
                    status.textContent = "✅ " + data.message;
                    status.style.color = "green";
                } else {
                    status.textContent = "❌ " + data.message;
                    status.style.color = "red";
                }
            } catch (err) {
                status.textContent = "Error checking username.";
                status.style.color = "gray";
            }
        }
    </script>
</head>

<body>
    <h2>Check Username Availability</h2>
    <input type="text" id="username" oninput="checkUsername()" placeholder="Enter username">
    <p id="status"></p>
</body>

</html>
